<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ttBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ttBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="ttEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="ttAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Main Window Container -->
  <rect width="800" height="500" rx="24" fill="url(#ttBg)" stroke="#334155" stroke-width="2" />

  <!-- Top App Bar -->
  <rect x="16" y="16" width="768" height="48" rx="14" fill="#1E293B" />
  <circle cx="42" cy="40" r="6" fill="#EF4444" />
  <circle cx="62" cy="40" r="6" fill="#F59E0B" />
  <circle cx="82" cy="40" r="6" fill="#10B981" />
  <text x="760" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="end">جدول التوقيت الأسبوعي الذكي — تنبيه الحصة القادمة آلياً</text>
  <rect x="115" y="27" width="145" height="26" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1" />
  <text x="187" y="44" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34D399" text-anchor="middle">الحجم الساعي: 18 سا/أسبوع</text>

  <!-- Time Columns Header (RTL Layout: Day on Right, Hours flowing Left) -->
  <g transform="translate(16, 78)" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94A3B8">
    <rect x="658" y="0" width="110" height="36" rx="10" fill="#0F172A" stroke="#334155" />
    <text x="713" y="23" fill="#E2E8F0" text-anchor="middle">اليوم / التوقيت</text>

    <rect x="528" y="0" width="122" height="36" rx="10" fill="#0F172A" stroke="#334155" />
    <text x="589" y="23" text-anchor="middle">08:00 - 09:00</text>

    <rect x="398" y="0" width="122" height="36" rx="10" fill="#0F172A" stroke="#334155" />
    <text x="459" y="23" text-anchor="middle">09:00 - 10:00</text>

    <rect x="268" y="0" width="122" height="36" rx="10" fill="#0F172A" stroke="#334155" />
    <text x="329" y="23" text-anchor="middle">10:00 - 11:00</text>

    <rect x="138" y="0" width="122" height="36" rx="10" fill="#0F172A" stroke="#334155" />
    <text x="199" y="23" text-anchor="middle">13:30 - 14:30</text>

    <rect x="0" y="0" width="130" height="36" rx="10" fill="#0F172A" stroke="#334155" />
    <text x="65" y="23" text-anchor="middle">14:30 - 15:30</text>
  </g>

  <!-- Row 1: Sunday (الأحد) -->
  <g transform="translate(16, 124)" font-family="sans-serif">
    <rect x="658" y="0" width="110" height="64" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="713" y="37" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">الأحد</text>

    <!-- 08-09: 3 ع ت 1 -->
    <rect x="528" y="0" width="122" height="64" rx="12" fill="url(#ttBlue)" />
    <text x="589" y="26" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3 ع ت 1 (درس)</text>
    <text x="589" y="46" font-size="11" fill="#DBEAFE" text-anchor="middle">القاعة 12 • 35 تلميذ</text>

    <!-- 09-10: 3 ع ت 1 -->
    <rect x="398" y="0" width="122" height="64" rx="12" fill="url(#ttBlue)" />
    <text x="459" y="26" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3 ع ت 1 (تمارين)</text>
    <text x="459" y="46" font-size="11" fill="#DBEAFE" text-anchor="middle">القاعة 12 • متابعة</text>

    <!-- 10-11: Empty -->
    <rect x="268" y="0" width="122" height="64" rx="12" fill="#0F172A" stroke="#1E293B" stroke-dasharray="4,4" />
    <text x="329" y="36" font-size="11" fill="#475569" text-anchor="middle">ساعة فراغ</text>

    <!-- 13:30-15:30: TP Lab -->
    <rect x="0" y="0" width="260" height="64" rx="12" fill="url(#ttEmerald)" />
    <text x="130" y="26" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3 ع ت 1 — أعمال مخبرية (TP • الفوج 1)</text>
    <text x="130" y="46" font-size="11" fill="#D1FAE5" text-anchor="middle">المخبر 02 • معايرة حمض-أساس</text>
  </g>

  <!-- Row 2: Monday (الإثنين) -->
  <g transform="translate(16, 198)" font-family="sans-serif">
    <rect x="658" y="0" width="110" height="64" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="713" y="37" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">الإثنين</text>

    <!-- 08-10: 2 ع ت 2 -->
    <rect x="398" y="0" width="252" height="64" rx="12" fill="url(#ttAmber)" />
    <text x="524" y="26" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2 علوم تجريبية 2 — أعمال موجهة (الفوج 2)</text>
    <text x="524" y="46" font-size="11" fill="#FEF3C7" text-anchor="middle">المخبر 01 • الطاقة الكامنة المرونية</text>

    <!-- 10-11: 3 ت ر 1 -->
    <rect x="268" y="0" width="122" height="64" rx="12" fill="url(#ttBlue)" />
    <text x="329" y="26" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3 تقني رياضي</text>
    <text x="329" y="46" font-size="11" fill="#DBEAFE" text-anchor="middle">القاعة 08 • درس</text>

    <!-- Afternoon -->
    <rect x="138" y="0" width="122" height="64" rx="12" fill="#0F172A" stroke="#1E293B" stroke-dasharray="4,4" />
    <text x="199" y="36" font-size="11" fill="#475569" text-anchor="middle">تنسيق المادة</text>

    <rect x="0" y="0" width="130" height="64" rx="12" fill="url(#ttBlue)" />
    <text x="65" y="26" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2 ع ت 2 (درس)</text>
    <text x="65" y="46" font-size="11" fill="#DBEAFE" text-anchor="middle">القاعة 15</text>
  </g>

  <!-- Row 3: Tuesday (الثلاثاء) -->
  <g transform="translate(16, 272)" font-family="sans-serif">
    <rect x="658" y="0" width="110" height="64" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="713" y="37" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">الثلاثاء</text>

    <rect x="528" y="0" width="122" height="64" rx="12" fill="url(#ttEmerald)" />
    <text x="589" y="26" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3 ت ر (مخبر ف1)</text>
    <text x="589" y="46" font-size="11" fill="#D1FAE5" text-anchor="middle">المخبر 02</text>

    <rect x="398" y="0" width="122" height="64" rx="12" fill="url(#ttEmerald)" />
    <text x="459" y="26" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3 ت ر (مخبر ف2)</text>
    <text x="459" y="46" font-size="11" fill="#D1FAE5" text-anchor="middle">المخبر 02</text>

    <rect x="268" y="0" width="122" height="64" rx="12" fill="url(#ttBlue)" />
    <text x="329" y="26" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3 ع ت 1 (فرض)</text>
    <text x="329" y="46" font-size="11" fill="#DBEAFE" text-anchor="middle">القاعة 12 • محروس</text>

    <rect x="0" y="0" width="260" height="64" rx="12" fill="#0F172A" stroke="#1E293B" />
    <text x="130" y="37" font-size="12" font-weight="bold" fill="#64748B" text-anchor="middle">أمسية حرة (الثلاثاء مساءً)</text>
  </g>

  <!-- Row 4: Wednesday & Thursday Summary (الأربعاء والخميس) -->
  <g transform="translate(16, 346)" font-family="sans-serif">
    <rect x="658" y="0" width="110" height="64" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="713" y="37" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">الأربعاء</text>

    <rect x="268" y="0" width="382" height="64" rx="12" fill="url(#ttEmerald)" />
    <text x="459" y="26" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3 ع ت 1 — أعمال مخبرية (TP • الفوج 2) + تصحيح الفرض</text>
    <text x="459" y="46" font-size="11" fill="#D1FAE5" text-anchor="middle">فتح سجل الحضور والنقاط للقسم تلقائياً حسب التوقيت</text>

    <rect x="0" y="0" width="260" height="64" rx="12" fill="url(#ttAmber)" />
    <text x="130" y="26" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">حصة استدراك ودعم بيداغوجي</text>
    <text x="130" y="46" font-size="11" fill="#FEF3C7" text-anchor="middle">التلاميذ المحددين آلياً (المعدل &lt; 10)</text>
  </g>

  <!-- Bottom Smart Notification Bar -->
  <g transform="translate(16, 424)" font-family="sans-serif">
    <rect x="0" y="0" width="768" height="58" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4" />
    <circle cx="735" cy="29" r="14" fill="#2563EB" />
    <text x="735" y="34" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">⚡</text>
    <text x="708" y="25" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="end">الربط الذكي بالحصة الجارية: يفتح الدفتر قسمك الحالي تلقائياً حسب جدول توقيتك</text>
    <text x="708" y="44" font-size="11" fill="#94A3B8" text-anchor="end">تنبيه صوتي وبصري قبل نهاية الحصة بـ 5 دقائق لتسجيل الدرس في الدفتر اليومي</text>
  </g>
</svg>
