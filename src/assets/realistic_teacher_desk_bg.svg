<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sunlight streaming through classroom windows -->
    <linearGradient id="classroomSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="50%" stop-color="#1E3E62" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <radialGradient id="windowSunlight" cx="18%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="smartboardGlow" cx="65%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="wallTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="floorWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#332211" />
      <stop offset="50%" stop-color="#1E1610" />
      <stop offset="100%" stop-color="#0B0908" />
    </linearGradient>

    <linearGradient id="chalkboardGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#042F2E" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <linearGradient id="deskTopWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="50%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="sunRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Classroom Wall -->
  <rect width="1920" height="720" fill="url(#wallTone)" />

  <!-- Classroom Perspective Floor -->
  <polygon points="0,720 1920,720 1920,1080 0,1080" fill="url(#floorWood)" />
  <line x1="0" y1="720" x2="1920" y2="720" stroke="#475569" stroke-width="4" opacity="0.6" />

  <!-- Floor Perspective Grid Tiles -->
  <g stroke="#F59E0B" stroke-opacity="0.14" stroke-width="2">
    <line x1="250" y1="720" x2="50" y2="1080" />
    <line x1="550" y1="720" x2="420" y2="1080" />
    <line x1="850" y1="720" x2="800" y2="1080" />
    <line x1="1150" y1="720" x2="1200" y2="1080" />
    <line x1="1450" y1="720" x2="1580" y2="1080" />
    <line x1="1750" y1="720" x2="1900" y2="1080" />
    <line x1="0" y1="810" x2="1920" y2="810" />
    <line x1="0" y1="920" x2="1920" y2="920" />
  </g>

  <!-- Left Classroom Large Panoramic Windows with Daylight -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="380" height="500" rx="14" fill="url(#classroomSky)" stroke="#64748B" stroke-width="8" />
    <!-- Sky & Trees Outside Window -->
    <circle cx="110" cy="110" r="55" fill="#FDE047" opacity="0.55" />
    <path d="M 0 380 Q 95 310 190 370 T 380 350 L 380 500 L 0 500 Z" fill="#065F46" opacity="0.65" />
    <path d="M 0 430 Q 140 370 260 420 T 380 410 L 380 500 L 0 500 Z" fill="#047857" opacity="0.75" />
    <!-- Window Panes -->
    <line x1="190" y1="0" x2="190" y2="500" stroke="#64748B" stroke-width="8" />
    <line x1="0" y1="250" x2="380" y2="250" stroke="#64748B" stroke-width="8" />
  </g>

  <!-- Ambient Sunlight & Smartboard Glow -->
  <circle cx="320" cy="280" r="700" fill="url(#windowSunlight)" />
  <circle cx="1220" cy="340" r="650" fill="url(#smartboardGlow)" />

  <!-- Diagonal Sunbeams Entering Classroom -->
  <polygon points="60,90 440,90 1150,1080 350,1080" fill="url(#sunRay)" />
  <polygon points="60,340 440,340 900,1080 180,1080" fill="url(#sunRay)" />

  <!-- Center-Right Panoramic Classroom Board & Interactive Smartboard -->
  <g transform="translate(560, 110)">
    <!-- Traditional Green Board Frame -->
    <rect x="0" y="0" width="1180" height="440" rx="16" fill="url(#chalkboardGreen)" stroke="#92400E" stroke-width="12" />
    <rect x="14" y="14" width="1152" height="412" rx="8" fill="none" stroke="#34D399" stroke-opacity="0.25" stroke-width="2" />

    <!-- Physics & Math Formulas on Left Side of Green Board -->
    <g fill="#A7F3D0" opacity="0.55" font-family="sans-serif" font-weight="bold">
      <text x="1110" y="65" font-size="22" text-anchor="end">الجمهورية الجزائرية الديمقراطية الشعبية</text>
      <text x="1110" y="105" font-size="18" fill="#6EE7B7" text-anchor="end">المستوى: السنة الثالثة ثانوي — علوم تجريبية وتقني رياضي</text>
      <line x1="650" y1="125" x2="1110" y2="125" stroke="#34D399" stroke-opacity="0.4" stroke-width="2" />

      <text x="1110" y="170" font-size="20" fill="#FDE68A" text-anchor="end">الوحدة 01: المتابعة الزمنية لتحول كيميائي</text>
      <text x="1110" y="215" font-size="17" text-anchor="end">• سرعة التفاعل الحجمية: v(t) = (1/V) · dx/dt</text>
      <text x="1110" y="255" font-size="17" text-anchor="end">• زمن نصف التفاعل: x(t½) = xmax / 2</text>
      <text x="1110" y="295" font-size="17" text-anchor="end">• الناقلية النوعية: σ(t) = Σ λi · [Xi]</text>

      <!-- Graph Curve on Chalkboard -->
      <g transform="translate(680, 315)" stroke="#34D399" stroke-width="2.5" fill="none">
        <line x1="0" y1="85" x2="240" y2="85" stroke="#A7F3D0" />
        <line x1="0" y1="85" x2="0" y2="0" stroke="#A7F3D0" />
        <path d="M 0 85 Q 50 15 230 12" stroke="#FBBF24" stroke-width="3.5" />
        <line x1="0" y1="48" x2="65" y2="48" stroke="#38BDF8" stroke-dasharray="5,5" />
        <line x1="65" y1="48" x2="65" y2="85" stroke="#38BDF8" stroke-dasharray="5,5" />
      </g>
    </g>

    <!-- Mounted Digital Smart Screen on the Board (Left side of board) -->
    <g transform="translate(45, 38)">
      <rect x="0" y="0" width="520" height="340" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.7" />
      <rect x="14" y="14" width="492" height="312" rx="8" fill="#1E293B" />
      <!-- Smartboard Header -->
      <rect x="26" y="26" width="468" height="38" rx="6" fill="#0F172A" />
      <circle cx="48" cy="45" r="6" fill="#EF4444" />
      <circle cx="68" cy="45" r="6" fill="#F59E0B" />
      <circle cx="88" cy="45" r="6" fill="#10B981" />
      <text x="475" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="end">الدفتر اليومي الذكي — عرض القسم التفاعلي</text>

      <!-- Smartboard Seating & Schedule Preview -->
      <g transform="translate(26, 78)">
        <rect x="0" y="0" width="145" height="75" rx="10" fill="#0F172A" stroke="#10B981" stroke-opacity="0.5" />
        <text x="130" y="26" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">الحضور الفعلي</text>
        <text x="130" y="55" font-family="sans-serif" font-size="22" font-weight="bold" fill="#34D399" text-anchor="end">34 / 35</text>

        <rect x="160" y="0" width="145" height="75" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.5" />
        <text x="290" y="26" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">الفوج الحاضر</text>
        <text x="290" y="55" font-family="sans-serif" font-size="20" font-weight="bold" fill="#38BDF8" text-anchor="end">فوج 1 + 2</text>

        <rect x="320" y="0" width="148" height="75" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.5" />
        <text x="452" y="26" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">معدل القسم</text>
        <text x="452" y="55" font-family="sans-serif" font-size="22" font-weight="bold" fill="#FBBF24" text-anchor="end">15.64</text>

        <!-- Mini Seating Grid on Smartboard -->
        <g transform="translate(0, 92)">
          <rect x="0" y="0" width="108" height="55" rx="8" fill="#064E3B" stroke="#10B981" stroke-opacity="0.6" />
          <rect x="120" y="0" width="108" height="55" rx="8" fill="#064E3B" stroke="#10B981" stroke-opacity="0.6" />
          <rect x="240" y="0" width="108" height="55" rx="8" fill="#1E3A8A" stroke="#38BDF8" stroke-opacity="0.6" />
          <rect x="360" y="0" width="108" height="55" rx="8" fill="#064E3B" stroke="#10B981" stroke-opacity="0.6" />

          <rect x="0" y="68" width="108" height="55" rx="8" fill="#064E3B" stroke="#10B981" stroke-opacity="0.6" />
          <rect x="120" y="68" width="108" height="55" rx="8" fill="#1E3A8A" stroke="#38BDF8" stroke-opacity="0.6" />
          <rect x="240" y="68" width="108" height="55" rx="8" fill="#064E3B" stroke="#10B981" stroke-opacity="0.6" />
          <rect x="360" y="68" width="108" height="55" rx="8" fill="#78350F" stroke="#F59E0B" stroke-opacity="0.6" />
        </g>
      </g>
    </g>
  </g>

  <!-- Classroom Student Desks in Foreground (3 Rows in Perspective) -->
  <!-- Row 1 Desks -->
  <g transform="translate(180, 680)" opacity="0.85">
    <!-- Desk 1 -->
    <g transform="translate(0, 0)">
      <polygon points="30,0 350,0 380,55 0,55" fill="url(#deskTopWood)" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="2" />
      <rect x="15" y="55" width="350" height="16" fill="#451A03" />
      <rect x="35" y="71" width="14" height="140" fill="#334155" />
      <rect x="330" y="71" width="14" height="140" fill="#334155" />
      <!-- Open Notebook on Desk -->
      <polygon points="120,10 250,10 260,42 110,42" fill="#F8FAFC" opacity="0.85" />
      <line x1="185" y1="10" x2="185" y2="42" stroke="#94A3B8" stroke-width="2" />
    </g>

    <!-- Desk 2 -->
    <g transform="translate(560, 0)">
      <polygon points="30,0 350,0 380,55 0,55" fill="url(#deskTopWood)" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="2" />
      <rect x="15" y="55" width="350" height="16" fill="#451A03" />
      <rect x="35" y="71" width="14" height="140" fill="#334155" />
      <rect x="330" y="71" width="14" height="140" fill="#334155" />
      <!-- Tablet on Desk -->
      <polygon points="140,12 240,12 248,42 132,42" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    </g>

    <!-- Desk 3 (Teacher Desk on Right) -->
    <g transform="translate(1120, -30)">
      <polygon points="20,0 440,0 470,70 -10,70" fill="#78350F" stroke="#FBBF24" stroke-opacity="0.5" stroke-width="2.5" />
      <rect x="5" y="70" width="450" height="160" rx="8" fill="#451A03" stroke="#92400E" stroke-width="2" />
      <!-- Laptop on Teacher Desk -->
      <polygon points="160,-45 290,-45 300,25 150,25" fill="#1E293B" stroke="#60A5FA" stroke-width="2.5" />
      <polygon points="145,25 305,25 320,48 130,48" fill="#475569" />
    </g>
  </g>

  <!-- Row 2 Closer Student Desks -->
  <g transform="translate(80, 860)" opacity="0.9">
    <g transform="translate(40, 0)">
      <polygon points="40,0 460,0 500,75 0,75" fill="url(#deskTopWood)" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="2" />
      <rect x="15" y="75" width="470" height="20" fill="#451A03" />
      <rect x="45" y="95" width="18" height="180" fill="#1E293B" />
      <rect x="435" y="95" width="18" height="180" fill="#1E293B" />
    </g>

    <g transform="translate(680, 0)">
      <polygon points="40,0 460,0 500,75 0,75" fill="url(#deskTopWood)" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="2" />
      <rect x="15" y="75" width="470" height="20" fill="#451A03" />
      <rect x="45" y="95" width="18" height="180" fill="#1E293B" />
      <rect x="435" y="95" width="18" height="180" fill="#1E293B" />
    </g>
  </g>
</svg>
