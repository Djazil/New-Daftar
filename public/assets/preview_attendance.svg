<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="600" height="400" rx="20" fill="url(#bgGrad)"/>

  <!-- App Header Glass Bar -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="560" height="54" rx="14" fill="#1E293B" stroke="url(#cardBorder)" stroke-width="1.5"/>
    <!-- Status Dots -->
    <circle cx="44" cy="47" r="5" fill="#EF4444"/>
    <circle cx="58" cy="47" r="5" fill="#F59E0B"/>
    <circle cx="72" cy="47" r="5" fill="#10B981"/>
    
    <text x="560" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="end">واجهة تسجيل الحضور والغياب المباشر</text>
    <text x="560" y="60" font-family="sans-serif" font-size="10" fill="#38BDF8" text-anchor="end">قسم: 3 علوم تجريبية 1 — الحصة المباشرة</text>
  </g>

  <!-- Smart 30-min Reminder Bar Mockup -->
  <rect x="20" y="86" width="560" height="36" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <circle cx="550" cy="104" r="6" fill="#34D399"/>
  <text x="535" y="108" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34D399" text-anchor="end">تذكير ذكي: تم تسجيل حضور 38 تلميذ بنجاح (نسبة الانضباط 97.3%)</text>

  <!-- Student Roster List Table Mockup -->
  <g filter="url(#shadow)">
    <!-- Row 1: Student Present -->
    <rect x="20" y="132" width="560" height="52" rx="12" fill="#1E293B" opacity="0.9" stroke="white" stroke-opacity="0.08"/>
    <circle cx="550" cy="158" r="14" fill="#3B82F6" opacity="0.2"/>
    <text x="550" y="162" font-family="sans-serif" font-size="11" font-weight="bold" fill="#60A5FA" text-anchor="middle">01</text>
    <text x="520" y="156" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="end">أحمد بن محمد بلقاسم</text>
    <text x="520" y="172" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">الفوج: 01 | الرقم: 1042</text>
    
    <!-- Status Badge: حاضراً -->
    <rect x="40" y="144" width="80" height="28" rx="8" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="80" y="162" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34D399" text-anchor="middle">حاضر ✓</text>

    <!-- Row 2: Student Late -->
    <rect x="20" y="192" width="560" height="52" rx="12" fill="#1E293B" opacity="0.9" stroke="white" stroke-opacity="0.08"/>
    <circle cx="550" cy="218" r="14" fill="#6366F1" opacity="0.2"/>
    <text x="550" y="222" font-family="sans-serif" font-size="11" font-weight="bold" fill="#818CF8" text-anchor="middle">02</text>
    <text x="520" y="216" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="end">سارة سليماني الإبراهيمي</text>
    <text x="520" y="232" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">الفوج: 01 | الرقم: 1043</text>
    
    <!-- Status Badge: متأخر -->
    <rect x="40" y="204" width="80" height="28" rx="8" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="80" y="222" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FBBF24" text-anchor="middle">متأخر (10د)</text>

    <!-- Row 3: Student Justified Absent -->
    <rect x="20" y="252" width="560" height="52" rx="12" fill="#1E293B" opacity="0.9" stroke="white" stroke-opacity="0.08"/>
    <circle cx="550" cy="278" r="14" fill="#1E1B4B" opacity="0.5"/>
    <text x="550" y="282" font-family="sans-serif" font-size="11" font-weight="bold" fill="#A5B4FC" text-anchor="middle">03</text>
    <text x="520" y="276" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="end">ياسين شريفي العباسي</text>
    <text x="520" y="292" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">الفوج: 02 | الرقم: 1044</text>

    <!-- Status Badge: غائب بمبرر -->
    <rect x="40" y="264" width="90" height="28" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="85" y="282" font-family="sans-serif" font-size="11" font-weight="bold" fill="#60A5FA" text-anchor="middle">غائب (مبرر)</text>
  </g>

  <!-- Footer Quick Stats -->
  <rect x="20" y="318" width="560" height="62" rx="12" fill="#0B0F19" stroke="white" stroke-opacity="0.1"/>
  <text x="550" y="342" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="end">المجموع: 38 تلميذ</text>
  <text x="550" y="362" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10B981" text-anchor="end">36 حاضر | 1 متأخر | 1 غائب</text>

  <rect x="40" y="332" width="160" height="34" rx="10" fill="#2563EB"/>
  <text x="120" y="353" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">حفظ السجل الفوري 💾</text>
</svg>
