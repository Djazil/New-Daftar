<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark Background Radial Lighting -->
    <radialGradient id="bgDepth" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- Blue/Indigo Glow Orbs -->
    <radialGradient id="blueGlowOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldGlowOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigoGlowOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Grid Lines -->
    <pattern id="gridPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="white" stroke-opacity="0.02" stroke-width="1"/>
      <circle cx="80" cy="80" r="1.5" fill="white" opacity="0.05"/>
    </pattern>

    <filter id="bgBlur" x="0" y="0" width="100%" height="100%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Deep Atmospheric Dark Base -->
  <rect width="1920" height="1080" fill="url(#bgDepth)"/>

  <!-- Subtle Classroom Modern Interior Line Art / Bokeh Spheres -->
  <circle cx="350" cy="280" r="450" fill="url(#blueGlowOrb)"/>
  <circle cx="1550" cy="350" r="500" fill="url(#indigoGlowOrb)"/>
  <circle cx="960" cy="800" r="400" fill="url(#emeraldGlowOrb)"/>

  <!-- Geometric Classroom Modern Board Lines & Perspective Depth -->
  <g stroke="white" stroke-opacity="0.03" stroke-width="1.5" fill="none">
    <!-- Perspective Classroom Horizon -->
    <path d="M 0 350 L 1920 350" stroke-opacity="0.05"/>
    <path d="M 0 850 L 1920 850" stroke-opacity="0.03"/>
    
    <!-- Architectural Columns / Classroom Glass Boards Silhouette -->
    <rect x="240" y="180" width="480" height="320" rx="24" stroke="white" stroke-opacity="0.04" stroke-width="2"/>
    <rect x="1200" y="180" width="480" height="320" rx="24" stroke="white" stroke-opacity="0.04" stroke-width="2"/>

    <!-- Subtle Science / Math Formulas Line Accents -->
    <g opacity="0.12" fill="#60A5FA" font-family="sans-serif" font-size="16" font-weight="bold">
      <text x="300" y="240">E = mc²</text>
      <text x="300" y="280">f(x) = ∫ (ax² + bx + c) dx</text>
      <text x="300" y="320">pH = -log[H+]</text>
      <text x="300" y="360">v = Δd / Δt</text>
      <text x="300" y="400">97.8% Attendance Rate</text>

      <text x="1260" y="240">الدفتر اليومي الذكي — الطور الثانوي</text>
      <text x="1260" y="280">Σ (علامات الفروض) / N = المعدل</text>
      <text x="1260" y="320">تقويم مستمر + أعمال تطبيقية TP</text>
      <text x="1260" y="360">تنبيه الغياب التلقائي ✓</text>
    </g>
  </g>

  <!-- Overlay Grid for Apple Tech Aesthetic -->
  <rect width="1920" height="1080" fill="url(#gridPattern)"/>

  <!-- Subtle Vignette Frame -->
  <rect width="1920" height="1080" fill="none" stroke="#020617" stroke-width="40" opacity="0.6"/>
</svg>
