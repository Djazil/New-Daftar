<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="600" height="400" rx="20" fill="url(#bgGrad2)"/>

  <!-- App Header Glass Bar -->
  <g filter="url(#shadow2)">
    <rect x="20" y="20" width="560" height="54" rx="14" fill="#1E293B" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="44" cy="47" r="5" fill="#EF4444"/>
    <circle cx="58" cy="47" r="5" fill="#F59E0B"/>
    <circle cx="72" cy="47" r="5" fill="#10B981"/>
    
    <text x="560" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="end">كشف النقاط والتقويم المستمر التلقائي</text>
    <text x="560" y="60" font-family="sans-serif" font-size="10" fill="#A7F3D0" text-anchor="end">حساب معدل الفروض + TP + السلوك والمشاركة آلياً</text>
  </g>

  <!-- Summary Cards Grid -->
  <g filter="url(#shadow2)">
    <!-- Card 1: Class Average -->
    <rect x="390" y="86" width="190" height="80" rx="14" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.4"/>
    <text x="565" y="108" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="end">معدل القسم العام</text>
    <text x="565" y="138" font-family="sans-serif" font-size="22" font-weight="bold" fill="#60A5FA" text-anchor="end">15.85 / 20</text>
    <text x="565" y="154" font-family="sans-serif" font-size="9" fill="#34D399" text-anchor="end">▲ ارتفاع بمقدار +1.4 نقطة</text>

    <!-- Card 2: Highest Grade -->
    <rect x="205" y="86" width="170" height="80" rx="14" fill="#1E293B" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="360" y="108" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="end">أعلى نقطة بالقسم</text>
    <text x="360" y="138" font-family="sans-serif" font-size="22" font-weight="bold" fill="#34D399" text-anchor="end">19.50 / 20</text>
    <text x="360" y="154" font-family="sans-serif" font-size="9" fill="#A7F3D0" text-anchor="end">التلميذ: مريم حداد</text>

    <!-- Card 3: Success Rate -->
    <rect x="20" y="86" width="170" height="80" rx="14" fill="#1E293B" stroke="#818CF8" stroke-opacity="0.4"/>
    <text x="175" y="108" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="end">نسبة النجاح (≥10)</text>
    <text x="175" y="138" font-family="sans-serif" font-size="22" font-weight="bold" fill="#A855F7" text-anchor="end">94.7%</text>
    <text x="175" y="154" font-family="sans-serif" font-size="9" fill="#C084FC" text-anchor="end">36 من أصل 38 تلميذ</text>
  </g>

  <!-- Detailed Student Grades Preview Table -->
  <g filter="url(#shadow2)">
    <!-- Header -->
    <rect x="20" y="180" width="560" height="32" rx="8" fill="#0F172A" stroke="white" stroke-opacity="0.1"/>
    <text x="550" y="200" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="end">اسم التلميذ</text>
    <text x="360" y="200" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="middle">الفرض 1</text>
    <text x="270" y="200" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="middle">الفرض 2</text>
    <text x="180" y="200" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="middle">أعمال تطبيقية TP</text>
    <text x="80" y="200" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="middle">المعدل المحسوب</text>

    <!-- Student Row 1 -->
    <rect x="20" y="218" width="560" height="46" rx="10" fill="#1E293B" opacity="0.9"/>
    <text x="550" y="245" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="end">مريم حداد بن بوزيد</text>
    <text x="360" y="245" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34D399" text-anchor="middle">19.00</text>
    <text x="270" y="245" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34D399" text-anchor="middle">19.50</text>
    <text x="180" y="245" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34D399" text-anchor="middle">20.00</text>
    <rect x="40" y="228" width="80" height="26" rx="6" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="80" y="245" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34D399" text-anchor="middle">19.50 ★</text>

    <!-- Student Row 2 -->
    <rect x="20" y="270" width="560" height="46" rx="10" fill="#1E293B" opacity="0.9"/>
    <text x="550" y="297" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="end">حمزة بوضياف عبد الرحمن</text>
    <text x="360" y="297" font-family="sans-serif" font-size="12" font-weight="bold" fill="#60A5FA" text-anchor="middle">15.50</text>
    <text x="270" y="297" font-family="sans-serif" font-size="12" font-weight="bold" fill="#60A5FA" text-anchor="middle">16.00</text>
    <text x="180" y="297" font-family="sans-serif" font-size="12" font-weight="bold" fill="#60A5FA" text-anchor="middle">17.00</text>
    <rect x="40" y="280" width="80" height="26" rx="6" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="80" y="297" font-family="sans-serif" font-size="12" font-weight="bold" fill="#60A5FA" text-anchor="middle">16.16</text>

    <!-- Student Row 3 -->
    <rect x="20" y="322" width="560" height="46" rx="10" fill="#1E293B" opacity="0.9"/>
    <text x="550" y="349" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="end">خالد بومعزة علي</text>
    <text x="360" y="349" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FBBF24" text-anchor="middle">13.00</text>
    <text x="270" y="349" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FBBF24" text-anchor="middle">12.50</text>
    <text x="180" y="349" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FBBF24" text-anchor="middle">15.00</text>
    <rect x="40" y="332" width="80" height="26" rx="6" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="80" y="349" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FBBF24" text-anchor="middle">13.50</text>
  </g>
</svg>
